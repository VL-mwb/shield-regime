[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shield-regime"
version = "0.1.2"
description = "Detect market manipulation using price kinematics and volume anomaly analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "VL-mwb" },
]
keywords = [
    "finance",
    "market-manipulation",
    "pump-and-dump",
    "wash-trading",
    "regtech",
    "anomaly-detection",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "plotly>=5.10.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2.0",
    "FinMind>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/VL-mwb/shield-regime"
Documentation = "https://github.com/VL-mwb/shield-regime#readme"
Repository = "https://github.com/VL-mwb/shield-regime"
Issues = "https://github.com/VL-mwb/shield-regime/issues"
